name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Run manually with "release" ticked to publish v<app version> without pushing a tag yourself.
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release for the current app version
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./app/src-tauri/tauri.conf.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            mcp/package-lock.json
      - name: Builder tests
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: MCP server tests
        working-directory: mcp
        run: |
          npm ci
          npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; the app only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release && 'v__VERSION__') || '' }}
          releaseName: Roblox UI Builder v__VERSION__
          releaseBody: Download the .exe (Windows) or .dmg (macOS) below. Installed apps update themselves with Check for updates.
          releaseDraft: false
      - uses: actions/upload-artifact@v4
        with:
          name: roblox-ui-builder-${{ runner.os }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
